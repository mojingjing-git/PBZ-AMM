[workspace]
resolver = "2"
members = [
    "crates/pbz-amm-core",
    "crates/pbz-amm-cli",
    "apps/pbz-amm-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mojingjing-git/PBZ-AMM"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
repak = { git = "https://github.com/trumank/repak.git", rev = "355b5f62f51959c7cc6dd5a51708646ef483065d", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust2 = "0.20"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"
winreg = "0.55"
zip = { version = "2", default-features = false, features = ["deflate"] }
